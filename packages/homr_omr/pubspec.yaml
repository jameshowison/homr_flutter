name: homr_omr
description: >
  On-device OMR (optical music recognition) pipeline for printed sheet music:
  preprocessed PNG in, MusicXML 4.0 out.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_onnxruntime: ^1.5.1
  image: ^4.0.0
  xml: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/models/
